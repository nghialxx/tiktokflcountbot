name: Check TikTok Followers

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check_followers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TikTok follower script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GF_CHAT_ID: ${{ secrets.GF_CHAT_ID }}
        run: python3 tiktok_alert.py
